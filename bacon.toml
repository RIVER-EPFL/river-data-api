# bacon.toml - Configuration for bacon hot-reload

default_job = "run"

[jobs.check]
command = ["cargo", "check", "--color", "always"]
need_stdout = false

[jobs.clippy]
command = ["cargo", "clippy", "--all-targets", "--color", "always"]
need_stdout = false

[jobs.test]
command = ["cargo", "test", "--color", "always"]
need_stdout = true

[jobs.test-integration]
command = ["cargo", "test", "--tests", "--color", "always", "--", "--test-threads=1"]
need_stdout = true

[jobs.test-unit]
command = ["cargo", "test", "--lib", "--color", "always"]
need_stdout = true

[jobs.run]
command = ["cargo", "run", "--color", "always"]
need_stdout = true
allow_warnings = true
background = true

[jobs.doc]
command = ["cargo", "doc", "--no-deps", "--color", "always"]
need_stdout = false

[keybindings]
c = "job:check"
l = "job:clippy"
t = "job:test"
i = "job:test-integration"
u = "job:test-unit"
r = "job:run"
d = "job:doc"
