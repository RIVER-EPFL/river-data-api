# The OpenCPU rApache handler, declared against the main server rather than a VirtualHost on a
# fixed port: the listening port arrives at start time (entrypoint.sh), because a container that
# has to bind 80 needs a capability and one that binds anything above 1024 does not.
<IfModule mod_R.c>

	RSourceOnStartup "/usr/lib/opencpu/rapache/onstartup.R"

	<Location /ocpu>
		SetHandler r-handler
		RHandler opencpu:::rapachehandler
		SetOutputFilter DEFLATE
		SetInputFilter DEFLATE
	</Location>

	# A child is recycled after this many requests, so a leak in a science package is bounded by
	# the child's lifetime rather than by the container's.
	MaxConnectionsPerChild 200

	<Directory /usr/lib/opencpu/rapache>
		Require all granted
	</Directory>

</IfModule>
