# Runner-specific server settings, kept in one file so the packaged apache2.conf stays as shipped.

ServerName river-tools-r
ServerTokens Prod
ServerSignature Off
TraceEnable Off

# Logs go to the container's streams: the filesystem is read-only, and a log file inside a
# container is a log nobody reads.
ErrorLog /dev/stderr
CustomLog /dev/stdout combined

# Prefork keeps one R process per child, so the child count is the memory multiplier. Eight is
# well above the one-at-a-time way the API calls this, and low enough that the container limit
# binds before the host notices.
<IfModule mpm_prefork_module>
	StartServers 2
	MinSpareServers 1
	MaxSpareServers 4
	MaxRequestWorkers 8
</IfModule>

# A request body is a script plus its inputs. Anything past a megabyte is not that.
LimitRequestBody 1048576
