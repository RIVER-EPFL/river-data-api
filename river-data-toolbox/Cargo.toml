[package]
name = "river-data-toolbox"
version = "0.1.0"
edition = "2021"
authors = ["Evan Thomas <evan.thomas@epfl.ch>"]
description = "Hydrochemistry calculation toolkit for river/stream sensor data"
license = "GPL-2.0-or-later"
keywords = ["hydrochemistry", "water-quality", "limnology", "pCO2", "DIC"]
categories = ["science"]

[lib]
name = "river_data_toolbox"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
anyhow = "1.0"

[dev-dependencies]
serde_json = "1.0"

[lints.clippy]
pedantic = "warn"
