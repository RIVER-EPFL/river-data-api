[workspace]
members = [".", "migration"]
resolver = "2"

[package]
name = "river-db"
version = "0.5.0"
edition = "2024"
rust-version = "1.95"
authors = ["RIVER Team"]
description = "Time-series sensor data API for Vaisala viewLinc"
license = "MIT"

[lints.rust]
unsafe_code = "forbid"

[dependencies]
# Web framework
axum = { version = "0.8", features = ["macros", "multipart"] }
tower = { version = "0.5", features = ["timeout", "limit"] }
tower-http = { version = "0.6", features = ["cors", "trace", "compression-gzip", "limit"] }

# Database
sea-orm = { version = "1.1", features = ["sqlx-postgres", "runtime-tokio-rustls", "with-uuid", "with-chrono", "with-json"] }
sea-orm-migration = { version = "1.1", features = ["sqlx-postgres", "runtime-tokio-rustls"] }

# Async runtime
tokio = { version = "1.43", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }

# Serialization
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_path_to_error = "0.1"
csv = "1.3"

# API docs
utoipa = { version = "5.3", features = ["axum_extras", "chrono", "uuid"] }
utoipa-axum = "0.2"
utoipa-scalar = { version = "0.3", features = ["axum"] }

# Utilities
uuid = { version = "1.11", features = ["v4", "serde"] }
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = "2.0"
futures = "0.3"
base64 = "0.22"

# Caching
moka = { version = "0.12", features = ["future"] }

# Authentication
axum-keycloak-auth = "0.8"

# Admin CRUD
crudcrate = { version = "0.9.2", features = ["postgresql", "derive"] }

# HTTP client (Keycloak admin proxy, Web Push)
reqwest = { version = "0.12", features = ["json"] }

# Chart rendering. `default-features = false` is load-bearing: the default
# `ttf` feature pulls font-kit -> fontconfig/freetype, which exist in neither the builder nor the
# debian-slim runtime image. `ab_glyph` keeps the text path pure Rust against an embedded font.
# PNG encoding of the rendered buffer. Pinned to the same 0.24 line plotters-bitmap already
# depends on, so this shares one compiled copy rather than adding a second.
image = { version = "0.24", default-features = false, features = ["png"] }
plotters = { version = "0.3.7", default-features = false, features = [
    "bitmap_backend",
    "bitmap_encoder",
    "ab_glyph",
    "line_series",
    "area_series",
    "chrono",
] }


# Crypto / token generation
sha2 = "0.10"
rand = "0.9"
# API-token secret hashing (argon2id). Verification is constant-time within the argon2 crate, so no
# separate timing-safe compare crate is needed.
argon2 = { version = "0.5", features = ["std"] }

# Web Push (VAPID + aes128gcm payload encryption)
web-push = { version = "0.11", default-features = false }

# Formula evaluation (sandboxed math expressions)
meval = "0.2"

# Rate limiting
governor = "0.8"
tower_governor = "0.6"

# Async traits
async-trait = "0.1"

# Migration support
migration = { path = "migration" }

# Core library (sync control plane)
river-data-core = { version = "0.9.0", features = ["openapi"] }

[dev-dependencies]
reqwest = { version = "0.12", features = ["json"] }
serde_json = "1.0"
serial_test = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
async-trait = "0.1"
axum = { version = "0.8", features = ["macros"] }
