[workspace]
members = [".", "migration"]
resolver = "2"

[patch.crates-io]
crudcrate = { path = "/home/ejthomas/projects/personal/crudcrate/crudcrate/crudcrate" }

[package]
name = "river-db"
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
authors = ["RIVER Team"]
description = "Time-series sensor data API for Vaisala viewLinc"
license = "MIT"

[lints.rust]
unsafe_code = "forbid"

[dependencies]
# Web framework
axum = { version = "0.8", features = ["macros", "multipart"] }
tower = { version = "0.5", features = ["timeout", "limit"] }
tower-http = { version = "0.6", features = ["cors", "trace", "compression-gzip", "limit"] }

# Database
sea-orm = { version = "1.1", features = ["sqlx-postgres", "runtime-tokio-rustls", "with-uuid", "with-chrono", "with-json"] }
sea-orm-migration = { version = "1.1", features = ["sqlx-postgres", "runtime-tokio-rustls"] }
sea-orm-timescale = "0.2.0"

# Async runtime
tokio = { version = "1.43", features = ["full"] }
tokio-stream = "0.1"

# Serialization
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
csv = "1.3"

# API docs
utoipa = { version = "5.3", features = ["axum_extras", "chrono", "uuid"] }
utoipa-axum = "0.2"
utoipa-scalar = { version = "0.3", features = ["axum"] }

# HTTP (required by crudcrate generated code)
hyper = "1"

# Utilities
uuid = { version = "1.11", features = ["v4", "serde"] }
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = "2.0"
futures = "0.3"

# Caching
moka = { version = "0.12", features = ["future"] }

# Authentication
axum-keycloak-auth = "0.8"

# Admin CRUD
crudcrate = { version = "0.9", features = ["postgresql", "derive"] }

# HTTP client (Keycloak admin proxy)
reqwest = { version = "0.12", features = ["json"] }

# Crypto / token generation
sha2 = "0.10"
rand = "0.9"

# Formula evaluation (sandboxed math expressions)
meval = "0.2"

# Rate limiting
governor = "0.8"
tower_governor = "0.6"

# Async traits
async-trait = "0.1"

# Migration support
migration = { path = "migration" }

# Core library (sync control plane + hydrochemistry toolbox)
river-data-core = { version = "0.2.0", features = ["server", "toolbox"] }

[dev-dependencies]
tokio-test = "0.4"
reqwest = { version = "0.12", features = ["json"] }
serde_json = "1.0"
serial_test = "3"
tower = { version = "0.5", features = ["util"] }
hyper = "1"
http-body-util = "0.1"
