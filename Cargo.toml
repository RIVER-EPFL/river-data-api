[workspace]
members = [".", "migration"]
resolver = "2"

[package]
name = "river-db"
version = "0.5.0"
edition = "2024"
rust-version = "1.95"
authors = ["RIVER Team"]
description = "Time-series sensor data API for Vaisala viewLinc"
default-run = "river-db"
license = "MIT"

[lints.rust]
unsafe_code = "forbid"

[dependencies]
# Web framework
axum = { version = "0.8", features = ["macros", "multipart"] }
tower = { version = "0.5", features = ["limit"] }
tower-http = { version = "0.6", features = [
    "cors",
    "trace",
    "compression-gzip",
    "limit",
    "timeout",
    "request-id",
] }

# Database
sea-orm = { version = "2.0", features = ["sqlx-postgres", "runtime-tokio-rustls", "with-uuid", "with-chrono", "with-json"] }
sea-orm-migration = { version = "2.0", features = ["sqlx-postgres", "runtime-tokio-rustls"] }

# Async runtime
tokio = { version = "1.43", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }

# Serialization
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
# `float_roundtrip`: without it the JSON parser can land a value one ULP from the literal it read,
# so a posted measurement is not the number that was entered.
serde_json = { version = "1.0", features = ["float_roundtrip"] }
serde_path_to_error = "0.1"
csv = "1.3"

# API docs
utoipa = { version = "5.3", features = ["axum_extras", "chrono", "uuid"] }
utoipa-axum = "0.2"
utoipa-scalar = { version = "0.3", features = ["axum"] }

# Utilities
uuid = { version = "1.11", features = ["v4", "v5", "serde"] }
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = "2.0"
futures = "0.3"
base64 = "0.22"

# Caching
moka = { version = "0.12", features = ["future"] }

# Authentication
axum-keycloak-auth = "0.8"

# Admin CRUD
crudcrate = { version = "0.14.0", features = ["postgresql", "derive"] }

# HTTP client (Keycloak admin proxy, Web Push)
reqwest = { version = "0.12", features = ["json"] }

# Crypto / token generation
sha2 = "0.10"
rand = "0.9"
# API-token secret hashing (argon2id). Verification is constant-time within the argon2 crate, so no
# separate timing-safe compare crate is needed.
argon2 = { version = "0.5", features = ["std"] }
subtle = "2.6"

# Web Push (VAPID + aes128gcm payload encryption)
web-push = { version = "0.11", default-features = false }

# Formula evaluation (sandboxed math expressions)
meval = "0.2"

# Rate limiting
governor = "0.8"
tower_governor = "0.6"

# Async traits
async-trait = "0.1"

# Migration support
migration = { path = "migration" }

# Core library (sync control plane)
river-data-core = { version = "0.14.1", features = ["openapi"] }

[dev-dependencies]
# The sync client, for the tests that drive a real `SyncDriver` against the API rather than
# writing its requests by hand. The crate itself needs only the schema derives.
river-data-core = { version = "0.14.1", features = ["openapi", "client"] }
reqwest = { version = "0.12", features = ["json"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
serial_test = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
async-trait = "0.1"
axum = { version = "0.8", features = ["macros"] }

# The feedback loop is dominated by linking, not by compiling: 32 test binaries carry the whole
# workspace's debug info each. Line tables are what a backtrace needs; unpacked debuginfo leaves it
# in the object files instead of copying it into every binary.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"
