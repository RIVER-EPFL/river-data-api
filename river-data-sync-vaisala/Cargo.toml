[package]
name = "river-data-sync-vaisala"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
description = "Vaisala viewLinc sync microservice for River Data"
license = "MIT"

[lints.rust]
unsafe_code = "forbid"

[dependencies]
# HTTP client
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.11", features = ["v4", "serde"] }

# Async runtime
tokio = { version = "1.43", features = ["full"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Environment
dotenvy = "0.15"

# Error handling
thiserror = "2.0"
