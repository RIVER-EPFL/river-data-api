[package]
name = "river-data-sync-portal"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
description = "MariaDB portal sync microservice for River Data (CNET, METALP, NOMIS)"
license = "MIT"

[lints.rust]
unsafe_code = "forbid"

[[bin]]
name = "river-data-sync-portal"
path = "src/main.rs"

[dependencies]
river-data-sync-common = { path = "../river-data-sync-common" }

# Database
sqlx = { version = "0.8", features = ["mysql", "runtime-tokio-rustls", "chrono"] }

# Async
tokio = { version = "1.43", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.11", features = ["v4", "serde"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Environment
dotenvy = "0.15"

# Error handling
thiserror = "2.0"
async-trait = "0.1"
