services:
  traefik:
    image: traefik:v2.11
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
    ports:
      - "${TRAEFIK_HTTP_PORT:-88}:80"
      - "${TRAEFIK_DASHBOARD_PORT:-8088}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  river-db-api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    environment:
      # Database
      - DB_USER=${POSTGRES_USER:-postgres}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-psql}
      - DB_HOST=river-db-timescale
      - DB_PORT=5432
      - DB_NAME=${POSTGRES_DB:-postgres}
      # API settings
      - API_HOST=${API_HOST:-0.0.0.0}
      - API_PORT=${API_PORT:-3000}
      - API_DEFAULT_PAGE_SIZE=${API_DEFAULT_PAGE_SIZE:-1000}
      - API_MAX_PAGE_SIZE=${API_MAX_PAGE_SIZE:-10000}
      # Rate limiting
      - DISABLE_RATE_LIMITING=${DISABLE_RATE_LIMITING:-false}
      - RATE_LIMIT_METADATA_PER_SECOND=${RATE_LIMIT_METADATA_PER_SECOND:-1}
      - RATE_LIMIT_METADATA_BURST=${RATE_LIMIT_METADATA_BURST:-60}
      - RATE_LIMIT_DATA_PER_SECOND=${RATE_LIMIT_DATA_PER_SECOND:-10}
      - RATE_LIMIT_DATA_BURST=${RATE_LIMIT_DATA_BURST:-60}
      - BULK_CONCURRENT_LIMIT=${BULK_CONCURRENT_LIMIT:-5}
      # Caching
      - CACHE_TTL_SECONDS=${CACHE_TTL_SECONDS:-300}
      - CACHE_MAX_BYTES=${CACHE_MAX_BYTES:-209715200}
      # Application
      - DEPLOYMENT=${DEPLOYMENT:-dev}
      - RUST_LOG=${RUST_LOG:-info,river_db=debug,sea_orm=warn,sqlx=warn}
      # CORS
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3005}
      # Connection pool
      - DB_MAX_CONNECTIONS=${DB_MAX_CONNECTIONS:-25}
      - DB_MIN_CONNECTIONS=${DB_MIN_CONNECTIONS:-5}
      # Timeouts
      - REQUEST_TIMEOUT_SECONDS=${REQUEST_TIMEOUT_SECONDS:-60}
      # Authentication
      - KEYCLOAK_URL=${KEYCLOAK_URL:-}
      - KEYCLOAK_REALM=${KEYCLOAK_REALM:-}
      - KEYCLOAK_CLIENT_ID=${KEYCLOAK_CLIENT_ID:-}
      - KEYCLOAK_ADMIN_CLIENT_ID=${KEYCLOAK_ADMIN_CLIENT_ID:-}
      - KEYCLOAK_ADMIN_CLIENT_SECRET=${KEYCLOAK_ADMIN_CLIENT_SECRET:-}
      - REQUIRE_PARTNER_AUTH=${REQUIRE_PARTNER_AUTH:-false}
    ports:
      - "${API_EXTERNAL_PORT:-3005}:${API_PORT:-3000}"
    depends_on:
      river-db-timescale:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:${API_PORT:-3000}/readyz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - ./src:/app/src
      - ./migration:/app/migration
      - ./river-data-sync-common/src:/app/river-data-sync-common/src
      - ./river-data-sync-vaisala/src:/app/river-data-sync-vaisala/src
      - ./river-data-toolbox/src:/app/river-data-toolbox/src
      - ./Cargo.toml:/app/Cargo.toml
      - ./Cargo.lock:/app/Cargo.lock
      - river-db-rust-data:/app/target
    labels:
      - "traefik.http.routers.river-db-api.rule=PathPrefix(`/api`) || PathPrefix(`/healthz`) || PathPrefix(`/docs`)"
      - "traefik.http.routers.river-db-api.priority=100"
      - "traefik.http.services.river-db-api.loadbalancer.server.port=${API_PORT:-3000}"

  river-data-sync-vaisala:
    build:
      context: .
      dockerfile: river-data-sync-vaisala/Dockerfile
    environment:
      # River Data API connection
      - API_BASE_URL=http://river-db-api:${API_PORT:-3000}/api/service
      # Control plane credentials (create via dashboard → Services tab)
      - SERVICE_CLIENT_ID=${SERVICE_CLIENT_ID:-}
      - SERVICE_CLIENT_SECRET=${SERVICE_CLIENT_SECRET:-}
      - INSTANCE_ID=${INSTANCE_ID:-vaisala-dev-01}
      # Vaisala viewLinc connection
      - VAISALA_BASE_URL=${VAISALA_BASE_URL:-https://10.95.35.5/rest/v1}
      - VAISALA_BEARER_TOKEN=${VAISALA_BEARER_TOKEN:-}
      - VAISALA_SKIP_TLS_VERIFY=${VAISALA_SKIP_TLS_VERIFY:-true}
      # Runner config
      - SYNC_INTERVAL_SECS=${SYNC_INTERVAL_SECS:-300}
      - HEARTBEAT_INTERVAL_SECS=${HEARTBEAT_INTERVAL_SECS:-30}
      - MAX_HISTORY_DAYS=${MAX_HISTORY_DAYS:-90}
      # Retry configuration
      - RETRY_MAX=${RETRY_MAX:-3}
      - RETRY_DELAY_SECONDS=${RETRY_DELAY_SECONDS:-60}
      # Logging
      - RUST_LOG=${SYNC_RUST_LOG:-info}
    depends_on:
      river-db-api:
        condition: service_healthy

  river-db-timescale:
    image: timescale/timescaledb:${TIMESCALEDB_VERSION:-2.23.0-pg18}
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-psql}
      - POSTGRES_DB=${POSTGRES_DB:-postgres}
    ports:
      - "${POSTGRES_EXTERNAL_PORT:-5443}:5432"
    volumes:
      - river-db-timescale-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    profiles: [auth]
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8180:8080"
    volumes:
      - ./keycloak-realm-dev.json:/opt/keycloak/data/import/realm.json:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && echo -e 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && cat <&3 | grep -q '200 OK'"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Portal source databases (dev only) ──────────────────────────────
  portal-db-cnet:
    image: mariadb:10.3
    profiles: [portal]
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: cnet_db
      MYSQL_USER: sync_reader
      MYSQL_PASSWORD: sync_reader
    ports:
      - "3310:3306"
    volumes:
      - ../../../../dumps/cnet_db_prod.sql:/docker-entrypoint-initdb.d/01-data.sql
      - portal-cnet-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  portal-db-metalp:
    image: mariadb:10.3
    profiles: [portal]
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: metalp_db
      MYSQL_USER: sync_reader
      MYSQL_PASSWORD: sync_reader
    ports:
      - "3311:3306"
    volumes:
      - ../../../../dumps/metalp_db_prod.sql:/docker-entrypoint-initdb.d/01-data.sql
      - portal-metalp-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  portal-db-nomis:
    image: mariadb:10.3
    profiles: [portal]
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: nomis_db
      MYSQL_USER: sync_reader
      MYSQL_PASSWORD: sync_reader
    ports:
      - "3312:3306"
    volumes:
      - ../../../../dumps/nomis_db_prod.sql:/docker-entrypoint-initdb.d/01-data.sql
      - portal-nomis-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  river-db-timescale-data:
  river-db-rust-data:
  portal-cnet-data:
  portal-metalp-data:
  portal-nomis-data:
