name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      timescaledb:
        image: timescale/timescaledb:2.23.0-pg18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: psql
          POSTGRES_DB: river_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Started here rather than as a `services:` container: services start before the checkout, so
      # they cannot mount the realm file this import needs.
      - name: Start Keycloak with the test realm
        run: |
          docker run -d --name keycloak -p 8180:8080 \
            -e KEYCLOAK_ADMIN=admin -e KEYCLOAK_ADMIN_PASSWORD=admin \
            -v "$PWD/tests/fixtures/keycloak-realm-test.json:/opt/keycloak/data/import/realm.json:ro" \
            quay.io/keycloak/keycloak:26.0 start-dev --import-realm
          for _ in $(seq 1 60); do
            if curl -sf http://localhost:8180/realms/river-data/.well-known/openid-configuration >/dev/null; then
              echo "Keycloak ready"; exit 0
            fi
            sleep 2
          done
          echo "Keycloak did not become ready"; docker logs keycloak; exit 1

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v3

      # Built from this commit's tools-runner/, not pulled: a test run has to exercise the R the
      # commit ships, or a change to the runner is green here and broken on deploy. Reads the
      # layer cache the publish workflow writes under the same scope, so an unchanged runner
      # costs a cache restore rather than an R package build.
      - name: Build the R tool runner
        uses: docker/build-push-action@v6
        with:
          context: tools-runner
          load: true
          tags: river-data-tools-r:test
          build-args: |
            IMAGE_BUILD_SHA=${{ github.sha }}
          cache-from: type=gha,scope=tools-r

      # Same restrictions the deployment applies, so a script that only works on a writable root
      # filesystem fails here rather than in the cluster.
      - name: Start the R tool runner
        run: |
          docker run -d --name tools-r -p 8006:80 \
            --read-only --cap-drop ALL --security-opt no-new-privileges:true \
            --tmpfs /tmp:uid=10001,gid=10001,mode=1777,size=256m \
            --tmpfs /run/apache2:uid=10001,gid=10001,mode=0750 \
            --tmpfs /var/lock/apache2:uid=10001,gid=10001,mode=0750 \
            --tmpfs /var/log/apache2:uid=10001,gid=10001,mode=0750 \
            --tmpfs /var/log/opencpu:uid=10001,gid=10001,mode=0750 \
            river-data-tools-r:test
          for _ in $(seq 1 60); do
            if curl -sf -X POST -H 'Content-Type: application/json' -d '{}' \
              'http://localhost:8006/ocpu/library/riverdata.tools/R/runtime_info/json?auto_unbox=true' >/dev/null; then
              echo "Tool runner ready"; exit 0
            fi
            sleep 2
          done
          echo "Tool runner did not become ready"; docker logs tools-r; exit 1

      - name: Run tests
        env:
          DATABASE_URL: postgresql://postgres:psql@localhost:5432/river_test
          RUST_LOG: warn
          # The app validates JWTs against these; the test helper mints them from the TEST_* pair.
          # Both must point at the same Keycloak or the issuer and JWKS checks fail.
          KEYCLOAK_URL: http://localhost:8180/
          KEYCLOAK_REALM: river-data
          KEYCLOAK_CLIENT_ID: river-data-ui-local
          KEYCLOAK_ADMIN_CLIENT_ID: river-data-api-local
          KEYCLOAK_ADMIN_CLIENT_SECRET: river-data-api-local-secret
          TEST_KEYCLOAK_URL: http://localhost:8180/
          TEST_KEYCLOAK_REALM: river-data
          TEST_KEYCLOAK_CLIENT_ID: river-data-ui-local
          # Without this a Keycloak-gated test skips silently, and a skip reports as a pass.
          REQUIRE_KEYCLOAK: "1"
          # Same shape for the OpenCPU tool runner: without it, a runner-gated test skips.
          TOOLS_RUNNER_URL: http://localhost:8006/ocpu
          REQUIRE_TOOLS_RUNNER: "1"
          # libtest sizes its threads from this (2 MB default). The unoptimised `e2e` binary needs
          # 3-4 MB, measured, and aborts with SIGABRT below that, taking the rest of the run with it.
          RUST_MIN_STACK: "16777216"
        run: cargo test --tests -- --test-threads=1

      - name: Keycloak logs on failure
        if: failure()
        run: docker logs keycloak

      - name: Tool runner logs on failure
        if: failure()
        run: docker logs tools-r
