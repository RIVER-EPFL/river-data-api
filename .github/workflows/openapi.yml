name: OpenAPI document

# The document is generated from the router itself, so a route or a schema type changes it without
# anyone editing JSON, and this job is what makes the committed copy keep up: it regenerates and
# fails on a diff, so a route change either brings the document with it or does not merge. The dump
# serves nothing and issues no query, so it needs neither a database nor any configuration. The
# same comparison runs in the test suite, which is what covers a change outside the paths below.
# The paths span the whole crate and its manifest, not the router alone: two schemas are declared
# `value_type = river_data_core::models::*` and the CRUD paths come from crudcrate's derive, so a
# dependency bump moves the document with nothing under `src/routes/` touched.
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "docs/openapi.json"
      - ".github/workflows/openapi.yml"
  pull_request:
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "docs/openapi.json"
      - ".github/workflows/openapi.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Dump the document
        run: cargo run --bin dump_openapi -- docs/openapi.json

      - name: Fail on a stale document
        run: |
          if ! git diff --quiet -- docs/openapi.json; then
            echo "docs/openapi.json is stale. Regenerate it with:"
            echo "  cargo run --bin dump_openapi -- docs/openapi.json"
            git diff --stat -- docs/openapi.json
            exit 1
          fi
          echo "The document matches the router"
